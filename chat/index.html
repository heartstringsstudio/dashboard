<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="description" content="Chat with Heartstrings Studio — questions answered about custom songs for weddings, memorials, birthdays & more." />
<title>Heartstrings Studio — Chat</title>
<link rel="icon" href="../logo.png" type="image/png" />
<link rel="apple-touch-icon" href="../logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }

  :root {
    --rose: #c0455a;
    --rose-light: #f0d4da;
    --rose-dark: #8e3a4d;
    --charcoal: #2C2926;
    --charcoal-mid: #4a4541;
    --warm-bg: #FAF7F4;
    --warm-surface: #F3EDE7;
    --warm-border: #DDD3C8;
    --text-primary: #2C2926;
    --text-secondary: #6B5F57;
    --text-muted: #7d7068;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'DM Sans', sans-serif;
  }

  :focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  body {
    font-family: var(--font-body);
    background: var(--warm-bg);
    color: var(--text-primary);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    width: 100%;
  }

  .chat-wrapper {
    width: 100%;
    max-width: 680px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-left: 1px solid var(--warm-border);
    border-right: 1px solid var(--warm-border);
    overflow: hidden;
  }

  .chat-header {
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 14px;
    border-bottom: 1px solid var(--warm-border);
    background: #fff;
    flex-shrink: 0;
    z-index: 10;
  }

  .header-inner {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .back-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--warm-border);
    background: #fff;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
  }

  .back-btn:hover { background: var(--warm-surface); color: var(--rose-dark); }
  .back-btn svg { width: 18px; height: 18px; }

  .logo-mark {
    width: 38px;
    height: 38px;
    background: var(--rose);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-mark svg { width: 20px; height: 20px; }

  .header-text h1 {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    color: var(--charcoal);
    letter-spacing: 0.01em;
  }

  .header-text p {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: #2e7d32;
    border-radius: 50%;
    display: inline-block;
    margin-right: 5px;
    vertical-align: middle;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .message {
    display: flex;
    gap: 10px;
    max-width: 100%;
  }

  .message.user {
    flex-direction: row-reverse;
  }

  .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    margin-top: 2px;
  }

  .avatar.bot {
    background: var(--rose-light);
    color: var(--rose-dark);
    font-family: var(--font-display);
    font-size: 13px;
    font-style: italic;
  }

  .avatar.user-av {
    background: var(--warm-surface);
    color: var(--text-secondary);
  }

  .bubble {
    padding: 11px 15px;
    border-radius: 16px;
    font-size: 14.5px;
    line-height: 1.6;
    max-width: calc(100% - 50px);
  }

  .message.bot .bubble {
    background: var(--warm-surface);
    color: var(--text-primary);
    border-radius: 4px 16px 16px 16px;
    border: 1px solid var(--warm-border);
  }

  .message.user .bubble {
    background: var(--rose);
    color: #fff;
    border-radius: 16px 4px 16px 16px;
  }

  .bubble a {
    color: var(--rose);
    text-decoration: underline;
  }

  .message.user .bubble a {
    color: #ffd4dc;
  }

  .bubble p { margin-bottom: 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul { padding-left: 18px; margin: 6px 0; }
  .bubble ul li { margin-bottom: 4px; }
  .bubble strong { font-weight: 700; }

  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 14px 16px;
    align-items: center;
  }

  .typing-indicator span {
    width: 7px;
    height: 7px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .suggestion-btn {
    background: #fff;
    border: 1px solid var(--warm-border);
    color: var(--text-secondary);
    font-family: var(--font-body);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .suggestion-btn:hover {
    background: var(--rose-light);
    border-color: var(--rose);
    color: var(--rose-dark);
  }

  .input-area {
    padding: 16px 20px calc(20px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--warm-border);
    background: #fff;
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--text-primary);
    background: var(--warm-surface);
    border: 1px solid var(--warm-border);
    border-radius: 22px;
    padding: 10px 16px;
    resize: none;
    min-height: 42px;
    max-height: 120px;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.15s;
    overflow-y: auto;
  }

  textarea:focus { border-color: var(--rose); }
  textarea::placeholder { color: var(--text-muted); }

  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--rose);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, transform 0.1s;
  }

  .send-btn:hover { background: var(--rose-dark); }
  .send-btn:active { transform: scale(0.95); }
  .send-btn:disabled { background: var(--warm-border); cursor: not-allowed; }

  .send-btn svg { width: 18px; height: 18px; }

  .powered-by {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding: 8px 0 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="chat-wrapper">
  <div class="chat-header">
    <div class="header-inner">
      <a class="back-btn" href="../" aria-label="Back to dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </a>
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Heartstrings Studio</h1>
        <p><span class="status-dot" aria-hidden="true"></span><span class="sr-only">Online — </span>Custom Songs · Lumberport, WV</p>
      </div>
    </div>
  </div>

  <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Chat messages"></div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" placeholder="Ask anything about a custom song…" rows="1" aria-label="Your message"></textarea>
      <button class="send-btn" id="sendBtn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="powered-by">Powered by Claude · Heartstrings Studio</div>
  </div>
</div>

<script>
const SYSTEM_PROMPT = `You are the friendly booking assistant for Heartstrings Studio, a custom songwriting business based in Lumberport, West Virginia, run by Tim Harbert. Your job is to warmly welcome potential clients, answer their questions, pre-qualify them, and guide them toward booking.

ABOUT HEARTSTRINGS STUDIO:
- Custom personalized songs for life occasions: memorials, weddings, birthdays, military tributes, anniversaries, milestones, and more
- Flat pricing: $150 per song. Commercial license (for businesses): +$100
- Standard turnaround is 48-72 hours, provided lines of communication remain open
- 24-hour rush service is available for any song type for an additional **$50** fee
- The finished product includes: a fully produced song + lyrics sheet with album art
- Delivery via Filemail download link
- One keepsake: lyrics sheet with album art background
- Not described as "AI-powered" — this is human-directed, emotionally resonant songwriting
- Studio has Appalachian roots and a warm, personal creative philosophy

HOW TO BOOK:
- Story Collection Form (intake): https://formspree.io/f/xykbvdrb
- Booking link: https://tinyurl.com/heartstringsstudiowv
- Funeral/memorial home partners: https://tinyurl.com/heartstringsfh

TONE:
- Warm, unhurried, genuine — like a neighbor who really listens
- Appalachian warmth: honest, direct, a little poetic
- For memorial inquiries: tender and careful
- Never pushy or salesy

PRE-QUALIFYING QUESTIONS TO ASK NATURALLY (don't fire all at once):
1. What occasion or person is the song for?
2. What feeling do they want the listener to have?
3. Is there a deadline?
4. Any preferred style or mood? (country, gospel, soft rock, ballad, etc.)

RULES:
- Never mention guitar specifically
- Never include a phone number
- Always point to the Story Collection form as the next step once someone is interested
- Keep responses concise — 2-4 short paragraphs max
- Format nicely with line breaks. Use **bold** sparingly for key info like prices
- If someone asks about funeral home partnerships, send them to: https://tinyurl.com/heartstringsfh
- Whenever turnaround time, deadlines, or pricing come up, always proactively mention that a **24-hour rush service** is available for an additional **$50** fee — do not wait to be asked`;

const HISTORY_KEY = 'hs-chat-history';
const FRIENDLY_ERROR = "Looks like we lost the connection for a moment — give it another try in a minute. If it keeps happening, you can always reach us through the Story Collection form: https://tinyurl.com/heartstringsstory";

let history = [];
try { history = JSON.parse(sessionStorage.getItem(HISTORY_KEY)) || []; } catch (e) { history = []; }
let isLoading = false;

function saveHistory() {
  try { sessionStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) {}
}

function escapeHTML(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatMessage(text) {
  return escapeHTML(text)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
}

function addMessage(role, text, showSuggestions = false) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role === 'bot' ? 'bot' : 'user-av'}`;
  avatar.textContent = role === 'bot' ? '♩' : 'You';
  avatar.setAttribute('aria-hidden', 'true');

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  const content = document.createElement('div');
  content.innerHTML = formatMessage(text);
  bubble.appendChild(content);

  if (showSuggestions) {
    const sugs = document.createElement('div');
    sugs.className = 'suggestions';
    const prompts = [
      'How much does a song cost?',
      'How does the process work?',
      'I need a memorial song',
      'Can I hear examples?'
    ];
    prompts.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'suggestion-btn';
      btn.textContent = p;
      btn.onclick = () => { document.getElementById('input').value = p; sendMessage(); };
      sugs.appendChild(btn);
    });
    bubble.appendChild(sugs);
  }

  div.appendChild(avatar);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message bot';
  div.id = 'typing';

  const avatar = document.createElement('div');
  avatar.className = 'avatar bot';
  avatar.textContent = '♩';
  avatar.setAttribute('aria-hidden', 'true');

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-indicator" aria-label="Heartstrings is typing"><span></span><span></span><span></span></div>';

  div.appendChild(avatar);
  div.appendChild(bubble);
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);
  history.push({ role: 'user', content: text });
  saveHistory();

  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  showTyping();

  try {
    const res = await fetch('https://heartstrings-chat.heartstringsstudiowv.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });

    const data = await res.json();
    const reply = data.content?.[0]?.text;
    if (!reply) throw new Error('Empty response');

    history.push({ role: 'assistant', content: reply });
    saveHistory();
    removeTyping();
    addMessage('bot', reply);
  } catch (e) {
    console.error('Chat request failed:', e);
    removeTyping();
    addMessage('bot', FRIENDLY_ERROR);
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
}

document.getElementById('sendBtn').addEventListener('click', sendMessage);

document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

document.getElementById('input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

window.addEventListener('load', () => {
  const greeting = `Hey there — welcome to Heartstrings Studio. 🎵\n\nI'm here to help you figure out if a custom song is right for what you have in mind, answer your questions, and get you pointed in the right direction.\n\nWhat brings you by today?`;
  addMessage('bot', greeting, history.length === 0);
  // restore the conversation if the page reloaded mid-chat
  history.forEach(m => addMessage(m.role === 'user' ? 'user' : 'bot', m.content));
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('../sw.js');
}
</script>
</body>
</html>
